{% extends 'base.html' %}

{% block title %}Crear Cuenta — Cine Paradiso{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="auth-card">
        <h2>Crear Cuenta</h2>
        <p class="auth-subtitle">Registrate para comprar entradas y servicios</p>

        <form method="POST" action="{{ url_for('public.registro') }}">
            <div class="form-group">
                <label for="nombre">Nombre y Apellido</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez" class="form-control">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com" class="form-control">
            </div>

            <div class="form-group">
                <label for="password">Contraseña (mínimo 6 caracteres)</label>
                <input type="password" id="password" name="password" minlength="6" required placeholder="••••••••" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
        </form>

        <p class="auth-footer-text">
            ¿Ya tenés cuenta? <a href="{{ url_for('public.login') }}">Iniciá sesión</a>
        </p>
    </div>
</div>
{% endblock %}
