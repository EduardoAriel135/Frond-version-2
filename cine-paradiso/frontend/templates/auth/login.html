{% extends 'base.html' %}

{% block title %}Iniciar Sesión — Cine Paradiso{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="auth-card">
        <h2>Iniciar Sesión</h2>
        <p class="auth-subtitle">Accedé a tus compras y reservá butacas</p>

        <form method="POST" action="{{ url_for('public.login') }}">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com" class="form-control">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>

        <p class="auth-footer-text">
            ¿No tenés una cuenta? <a href="{{ url_for('public.registro') }}">Registrate aquí</a>
        </p>

        <div class="admin-hint">
            <small>Para ingresar como Administrador: <code>admin@cineparadiso.com</code></small>
        </div>
    </div>
</div>
{% endblock %}
