<header class="navbar">
    <div class="container nav-container">
        <a href="{{ url_for('public.index') }}" class="brand-logo">
            <span class="logo-icon">🎬</span>
            <span class="brand-name">Cine <strong>Paradiso</strong></span>
        </a>

        <nav class="nav-links">
            <a href="{{ url_for('public.index') }}" class="nav-item">Cartelera</a>
            {% if usuario_sesion %}
                {% if usuario_sesion.rol == 'administrador' %}
                    <a href="{{ url_for('admin.dashboard') }}" class="nav-item">📊 Dashboard</a>
                    <a href="{{ url_for('admin.validar_qr') }}" class="nav-item">🎟️ Validar QR</a>
                    <a href="{{ url_for('admin.abm_servicios') }}" class="nav-item">🍿 Servicios</a>
                {% else %}
                    <a href="{{ url_for('public.perfil') }}" class="nav-item">Mi Perfil</a>
                {% endif %}
                <span class="user-greeting">Hola, <strong>{{ usuario_sesion.nombre }}</strong></span>
                <a href="{{ url_for('public.logout') }}" class="btn btn-outline-sm">Cerrar Sesión</a>
            {% else %}
                <a href="{{ url_for('public.login') }}" class="nav-item">Ingresar</a>
                <a href="{{ url_for('public.registro') }}" class="btn btn-primary-sm">Registrarse</a>
            {% endif %}
        </nav>
    </div>
</header>
